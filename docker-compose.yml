# ==============================================================================
# ScamGuard Docker Compose (Production Stack)
# Usage:
#   docker-compose up --build
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scamguard-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - scamguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scamguard-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - scamguard-net

networks:
  scamguard-net:
    driver: bridge
