# ==============================================================================
# ScamGuard Render Blueprint (render.yaml)
# Deploys FastAPI Backend (Web Service) + React Frontend (Static Site)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI + WebSocket Stream)
  # ----------------------------------------------------------------------------
  - type: web
    name: scamguard-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: RISK_THRESHOLD_ALERT
        value: "70"
      - key: RISK_THRESHOLD_WARNING
        value: "40"
      - key: FIREWORKS_STT_MODEL
        value: whisper-v3-turbo
      - key: FIREWORKS_LLM_MODEL
        value: accounts/fireworks/models/llama-v3p3-70b-instruct
      - key: FIREWORKS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DEFAULT_CHAT_ID
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Web Service (Static React SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: scamguard-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          name: scamguard-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
