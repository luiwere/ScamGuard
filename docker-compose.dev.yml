# ==============================================================================
# ScamGuard Docker Compose (Development Stack with Live Reload)
# Usage:
#   docker-compose -f docker-compose.dev.yml up --build
# ==============================================================================

version: '3.8'

services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scamguard-backend-dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/data:/app/data:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    networks:
      - scamguard-dev-net

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: scamguard-frontend-dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/scenarios
      - VITE_WS_URL=ws://localhost:8000/ws/call
    depends_on:
      - backend-dev
    restart: unless-stopped
    networks:
      - scamguard-dev-net

networks:
  scamguard-dev-net:
    driver: bridge
